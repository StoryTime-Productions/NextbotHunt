name: ${NAME}
version: ${VERSION}
main: ${PACKAGE}.NextbotHunt
api-version: "26.1"
author: StoryTimeProductions
description: Nextbot Hunt minigame for the StoryTime SMP — a relentless AI chaser hunts hiders.

commands:
  nextbothunt:
    description: Opens the Nextbot Hunt game lobby
    usage: /nextbothunt [join|leave|ready|start|status|debugspawn]
    aliases: [nbhunt, nbhlobby]
    permission: nextbothunt.play
    permission-message: You don't have permission to use this command.

permissions:
  nextbothunt.play:
    description: Allows access to /nextbothunt
    default: true
  nextbothunt.debug:
    description: Allows access to /nextbothunt debugspawn
    default: op
  nextbothunt.*:
    description: Grants all Nextbot Hunt permissions
    default: false
    children:
      nextbothunt.play: true
      nextbothunt.debug: true
